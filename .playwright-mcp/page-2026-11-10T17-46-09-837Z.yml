            - paragraph [ref=f2e280]: "Whole in the author's words: all seven of the author's utterances, and after each the essence of the session's answer in its own voice, the fuller answers written in the conversation and not kept. Whether each came spoken or typed is the session's reading; one word the dictation misheard is corrected, with what it wrote kept on the word. The work is in its commit: the kernel drawn from a prototype into the engine and the interface's sets worked out by it; the language said as text and written in code by a template; glass's functions named each by one word, with their ids kept, and some written in the language in the field; src/tools/ask.ts, a local engine at the command line, the probe and the read tool retired for it; the wiki brought to it. Each piece was read by fresh agents, a design attacked before it was built, the code read for its tone and bugs, and the command line used cold by an agent knowing nothing else, and what they found was mended; 169 tests pass."
