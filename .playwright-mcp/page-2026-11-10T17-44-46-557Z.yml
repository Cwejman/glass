      - heading "The primitives" [level=1] [ref=e181]
      - paragraph [ref=e182]: "Data, types, programs, AI and interfaces are one field of whole pieces, and everything else in glass grows on them. Here they are in the order they stand on each other: the holon, its type, the store that keeps it, the engine that holds the stores, the field they make, the program, its effect, AI, and the interface. They are few on purpose: the author's aim is a core set of primitives, done with quality."
      - paragraph [ref=e183]:
        - emphasis [ref=e184]:
          - text: The author's, from
          - link "the grant" [ref=e185] [cursor=pointer]:
            - /url: "#"
          - text: and
          - link "his words of 2026-10-31" [ref=e186] [cursor=pointer]:
            - /url: "#"
          - text: ; the store and the engine named as primitives his,
          - link "2026-11-01" [ref=e187] [cursor=pointer]:
            - /url: "#"
          - text: .
      - generic [ref=e188]:
        - heading [level=2] [ref=e189]:
          - link "Holon" [ref=e190] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e191]: "A holon is a small piece that is whole in itself, and part of the field and of any whole that holds it. A note is a holon, and so is a program, a type, a component and a mount: the same kind of piece throughout."
        - paragraph [ref=e192]: "A holon is its identity, what it is an instance of, and its body: what it holds. Beside them it may carry a name, by which it is addressed. The identity is given when it is born and never changes; every state it has had is kept as a version, each pointing back at the one before, so how it came to be stays readable."
        - paragraph [ref=e193]:
          - emphasis [ref=e194]:
            - text: "The name beside the identity the author's, 2026-11-05. Whole pieces the author's, from the grant; part of the field his, 2026-11-02: everything is part of the field; that holons have ids and history his, 2026-11-01 (\"holons have to have ids I think and have to have commits\"); the shape of versions the session's, laid out in"
            - link "the store" [ref=e195] [cursor=pointer]:
              - /url: "#"
            - text: .
      - generic [ref=e196]:
        - heading [level=2] [ref=e197]:
          - link "Type" [ref=e198] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e199]: "A type is a schema in the field: the structure a holon's data has. Data is by its nature structure, and types are what let a field hold structure of its own making, declared in the field itself, so a type is a holon too. Programs need data, and types are what they find it by."
        - paragraph [ref=e200]:
          - emphasis [ref=e201]:
            - text: "The author's, 2026-11-01: type is what allows you to create schemas within the field, what allows for structure, and that is what programs need. How a type is written, and how the store checks a holon against it, is"
            - link "open" [ref=e202] [cursor=pointer]:
              - /url: "#"
            - text: .
        - paragraph [ref=e203]: "Each field a type declares is said in prose as well as in structure: what the key means, beside the shape the engine checks. A field is where holons connect, so the fields are the field's ontological connectors, and holons joined at them form a larger ontology, readable by a person, a program or a language model alike."
        - paragraph [ref=e204]:
          - emphasis [ref=e205]: "The author's, 2026-11-02: the fields of a holon are contact points for prose, so that we can build ontologically upon them; where each holon connects are the ontological connectors, forming larger ontology. That the prose stands beside the checked shape, and models read it, the session's proposal of the same day, which he answered yes."
        - paragraph [ref=e206]: A type's fields are to stand beside its identity, out of its body, as its mould, since they say what other holons hold and not what the type itself holds; a cast, but for what comes from it. A holon is then a type by having a mould, and the type of types is let go.
        - paragraph [ref=e207]:
          - emphasis [ref=e208]:
            - text: "The author's, 2026-11-05: fields goes out of the body; being a type both by being an instance of Type and by having fields was double, so yes, we drop the type type; mould for now. Built, as"
            - link "the store" [ref=e209] [cursor=pointer]:
              - /url: "#"
            - text: tells.
      - generic [ref=e210]:
        - heading [level=2] [ref=e211]:
          - link "Store" [ref=e212] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e213]: "A store is where holons are kept and how they travel: every version of every holon, and every commit that changed them, as files that never change, with one pointer saying which commit is current. A store can be copied, served and attached anywhere, and every copy is whole."
        - paragraph [ref=e214]:
          - emphasis [ref=e215]:
            - text: The store as a primitive the author's, 2026-11-01; its shape proposed by the session and agreed by the author, given whole in
            - link "the store" [ref=e216] [cursor=pointer]:
              - /url: "#"
            - text: .
        - paragraph [ref=e217]: A store is one space, and any whole within it can be taken away as a store of its own.
        - paragraph [ref=e218]:
          - emphasis [ref=e219]:
            - text: The author's, 2026-11-04, told in
            - link "the store" [ref=e220] [cursor=pointer]:
              - /url: "#"
            - text: .
        - paragraph [ref=e221]: "A store is one source among the engine's integrations, the native one: git, the browser's history or a video's data are sources too, each with its own truth and format, reached through programs."
        - paragraph [ref=e222]:
          - emphasis [ref=e223]:
            - text: The author's, 2026-11-04, told in
            - link "the store" [ref=e224] [cursor=pointer]:
              - /url: "#"
            - text: .
      - generic [ref=e225]:
        - heading [level=2] [ref=e226]:
          - link "Engine" [ref=e227] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e228]: The engine holds the stores it attaches and is the only way into them. It reads them, carries out every change as a commit, and runs programs, and it judges every act against what the field declares, whoever asks. Nothing reaches a store but through an engine.
        - paragraph [ref=e229]:
          - emphasis [ref=e230]: "The author's, 2026-10-31 and 2026-11-01: a field needs an engine to govern it; carried from OpenLight's engine. How the engine runs a program, in what runtime and how contained, is open."
      - generic [ref=e231]:
        - heading [level=2] [ref=e232]:
          - link "Field" [ref=e233] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e234]: "The field is the stores an engine holds, read as one: where holons live together, and what programs and people ask. Holons hold each other as parts and point at each other from their bodies, so from any holon the field can be read upward to what holds it, downward to what it holds, and outward to what points at it."
        - paragraph [ref=e235]:
          - emphasis [ref=e236]:
            - text: The one field the author's, from the grant; stores read as one carried from OpenLight; how holons relate, the author's, 2026-11-02, told in
            - link "the relations" [ref=e237] [cursor=pointer]:
              - /url: "#"
            - text: .
      - generic [ref=e238]:
        - heading [level=2] [ref=e239]:
          - link "Program" [ref=e240] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e241]: "A program is a holon holding code that the engine runs. It declares the types it takes, the engine brings it the data that fits, and what it does, it does through the engine. A run is a program run once, kept as a holon too: what it was given, its result, and the commits its effects became."
        - paragraph [ref=e242]: "A program exists only through the engine: it is data until the engine runs it. How a run is carried out is the engine's, and still open."
        - paragraph [ref=e243]:
          - emphasis [ref=e244]:
            - text: "The author's, 2026-11-01: the program only exists through the engine, and how it is executed and run is open. Runs kept as holons his, the same day (\"it does use the field for runs, I would think\"); where they are kept is"
            - link "the home" [ref=e245] [cursor=pointer]:
              - /url: "#"
            - text: .
        - paragraph [ref=e246]: "A function is not a program. It is pure: evaluated wherever it is used, as in what an interface draws, every time it is drawn, so evaluating it is no event and nothing it gives is kept. A program is run, and a run is an event with a record. Both are first class, and a program cannot be used where a function is."
        - paragraph [ref=e247]:
          - emphasis [ref=e248]: "The author's, 2026-11-03: functions are different from programs, and functions are what are used in the UI; we're not renaming program to function, they're still a first class thing; can you use a program in a UI, I don't think you can."
      - generic [ref=e249]:
        - heading [level=2] [ref=e250]:
          - link "Effect" [ref=e251] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e252]: "A program acts by changing the field, and every change is a commit. The engine carries out the run, but what a run may touch is the field's to say: each place declares which programs may change it, and the engine follows that declaration. So every effect lands where it can be seen, within bounds the field itself holds."
        - paragraph [ref=e253]:
          - emphasis [ref=e254]: "The author's, 2026-10-31: the engine governs the execution but is merely governed by the declaration of the field. That each place declares it is the session's reading, as glass's first iteration built it."
      - generic [ref=e255]:
        - heading [level=2] [ref=e256]:
          - link "AI" [ref=e257] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e258]: "A completion model is a program, and each tool is a program of its own, separate from it. What is called an AI today is practically a harness: a program that calls a proprietary completion API and runs the tool calls it gets back. In glass the model, the tools and the harness are each a program in the field, taking their context from it and acting through it."
        - paragraph [ref=e259]:
          - emphasis [ref=e260]: The completion model and the tools as separate programs, and AI as practically a harness, the author's, 2026-10-31; the harness as one more program the session's synthesis.
      - generic [ref=e261]:
        - heading [level=2] [ref=e262]:
          - link "Interface" [ref=e263] [cursor=pointer]:
            - /url: "#"
        - paragraph [ref=e264]: An interface is holons drawn by holons. A component is a holon that declares the type it takes and draws what it is given, made of code or of data; and a mount is a call to one, a component given what it reads, its argument. A component encloses what it is given and opens a space in it, where what it holds is drawn in turn by the components whose types match, so an interface assembles itself level by level.
        - paragraph [ref=e265]:
          - emphasis [ref=e266]: "The author's, 2026-10-31: each component encloses and opens space for new holarchy and new type-matched components therein. The mount is OpenLight's."
        - paragraph [ref=e267]: "The primitives are still: they hold no state, take no press and move nowhere. Looking around the field is built on them, as one mount the reader keeps in their home, offered where the page's address says each time they look elsewhere."
        - paragraph [ref=e268]:
          - emphasis [ref=e269]:
            - text: The author's,
            - link "2026-11-03" [ref=e270] [cursor=pointer]:
              - /url: "#"
            - text: ": there is no state, no interaction, no navigation; it is something to birth upon the primitives, so it is editable. The one root mount the session's, from OpenLight's."