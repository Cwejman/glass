<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Glass</title>
    <style>
      /* Glass's material (components/materials/glass.css): its faces, served with the
         site, and its palette. One spacing scale, 4 8 12 16 24 32 48; one gutter at the
         page's edges, and nothing inset again within it; prose kept to a measure. One type
         scale: body text for everything read, card and field and bar alike; small for
         what is said about it; one notch up for a card's title and a lede; and headings,
         clearly bigger, for a page's title and a brief's prose. No line cuts the page:
         what scrolls fades out beneath the bar and at the bottom edge. */
      @font-face {
        font-family: "Source Serif 4";
        font-weight: 200 900;
        font-display: swap;
        src: url("../fonts/source-serif-4-latin-opsz-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Serif 4";
        font-style: italic;
        font-weight: 200 900;
        font-display: swap;
        src: url("../fonts/source-serif-4-latin-opsz-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 200 900;
        font-display: swap;
        src: url("../fonts/source-sans-3-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: italic;
        font-weight: 200 900;
        font-display: swap;
        src: url("../fonts/source-sans-3-latin-wght-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Code Pro";
        font-weight: 200 900;
        font-display: swap;
        src: url("../fonts/source-code-pro-latin-wght-normal.woff2") format("woff2");
      }
      :root {
        --ground: #fbfaf7;
        --raised: #ffffff;
        --ink: #23211d;
        --quiet: #6f6a61;
        --line: #e4e0d7;
        --link: #3d5a80;
        --wash: rgb(0 0 0 / 0.035);
        --serif: "Source Serif 4", Charter, Georgia, serif;
        --sans: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --mono: "Source Code Pro", ui-monospace, "SF Mono", Menlo, monospace;
        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s5: 24px;
        --s6: 32px;
        --s7: 48px;
        --gutter: var(--s6);
        --measure: 42rem;
        --radius: 8px;
        --size-small: 0.8125rem;
        --size-body: 1rem;
        --size-up: 1.125rem;
        --size-h3: 1.35rem;
        --size-h2: 1.7rem;
        --size-h1: 2.6rem;
        color-scheme: light dark;
        font: 16.5px / 1.55 var(--sans);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #171614;
          --raised: #1e1d1a;
          --ink: #e8e4dc;
          --quiet: #9b958a;
          --line: #2f2c28;
          --link: #9db4d6;
          --wash: rgb(255 255 255 / 0.05);
        }
      }
      @media (max-width: 640px) {
        :root {
          --gutter: var(--s4);
        }
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      main {
        padding: 0 var(--gutter) var(--s7);
      }
      a {
        color: var(--link);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.15em;
      }
      code,
      pre {
        font-family: var(--mono);
        font-size: 0.85em;
      }
      h1 {
        font: 600 var(--size-h1) / 1.1 var(--serif);
        letter-spacing: -0.01em;
        margin: 0;
        text-wrap: balance;
      }
      h2 {
        font: 600 var(--size-h2) / 1.2 var(--serif);
        margin: 0;
      }
      h3 {
        font: 600 var(--size-h3) / 1.25 var(--serif);
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      .drawn {
        display: contents;
      }
      .meta,
      .note {
        color: var(--quiet);
      }
      .note {
        margin: 0;
        font-style: italic;
      }
      .words {
        white-space: pre-wrap;
      }
      .number {
        font-variant-numeric: tabular-nums;
      }

      /* The Reader: a column of the search, then its answer. The search, its first, is the
         bar: kept at the top as the page passes behind it, with no box of its own. */
      #glass > .drawn > .list:not(.row) {
        gap: 0;
      }
      #glass > .drawn > .list > .drawn:first-child > .list.row {
        position: sticky;
        top: 0;
        z-index: 2;
        flex-wrap: nowrap;
        gap: var(--s2);
        margin: 0 calc(-1 * var(--gutter));
        padding: var(--s3) var(--gutter);
      }
      /* The bar has no surface: what scrolls beneath it fades out before it. */
      #glass > .drawn > .list > .drawn:first-child > .list.row::before {
        content: "";
        position: absolute;
        inset: 0 0 calc(-1 * var(--s6)) 0;
        z-index: -1;
        background: linear-gradient(
          var(--ground) calc(100% - var(--s6)),
          color-mix(in srgb, var(--ground) 0%, transparent)
        );
        pointer-events: none;
      }
      /* And at the bottom edge, the same. */
      main::after {
        content: "";
        position: fixed;
        inset: auto 0 0 0;
        z-index: 1;
        height: var(--s6);
        background: linear-gradient(color-mix(in srgb, var(--ground) 0%, transparent), var(--ground));
        pointer-events: none;
      }
      /* What the search could not read is said once, in the answer. */
      #glass > .drawn > .list > .drawn:first-child .note {
        display: none;
      }
      /* The pills, scrolled along where they are many, the input taking the rest. */
      #glass > .drawn > .list > .drawn:first-child > .list.row > .drawn:first-child > .list.row {
        flex: 0 1 auto;
        flex-wrap: nowrap;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #glass > .drawn > .list > .drawn:first-child > .list.row > .drawn:first-child > .list.row:empty {
        display: none;
      }
      #glass > .drawn > .list > .drawn:first-child > .list.row::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 30%;
        background: var(--link);
        opacity: 0;
        pointer-events: none;
      }
      body.busy #glass > .drawn > .list > .drawn:first-child > .list.row::after {
        opacity: 1;
        animation: working 1.1s ease-in-out infinite;
      }
      @keyframes working {
        from {
          left: -30%;
        }
        to {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body.busy #glass > .drawn > .list > .drawn:first-child > .list.row::after {
          animation: none;
          left: 0;
          width: 100%;
          opacity: 0.5;
        }
      }

      #glass > .drawn > .list > .drawn:first-child > .list.row > .drawn:first-child > .list.row {
        mask-image: linear-gradient(to right, #000 calc(100% - var(--s5)), transparent);
        padding-right: var(--s3);
      }

      /* The page opening, before anything is drawn. */
      .opening-said {
        margin: 0;
        padding-top: 88px;
        color: var(--quiet);
      }
      body.opening::before {
        content: "";
        position: fixed;
        top: 0;
        height: 2px;
        width: 30%;
        background: var(--link);
        animation: working 1.1s ease-in-out infinite;
      }
      body:not(.opening) .opening-said {
        display: none;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: var(--s5);
      }
      .list.row {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s2);
      }
      .list.row > .drawn:has(.expression-input) > .expression-input {
        flex: 1 1 12em;
        min-width: 0;
      }
      .pill {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: var(--s1);
        margin: 0;
        padding: 0 var(--s1) 0 var(--s3);
        height: 32px;
        box-sizing: border-box;
        border-radius: 999px;
        background: var(--wash);
        white-space: nowrap;
      }
      .pill .said {
        font: inherit;
        line-height: 1;
      }
      .pill button {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 999px;
        padding: 0;
        background: transparent;
        color: var(--quiet);
        font: inherit;
        cursor: pointer;
      }
      .pill button:hover,
      .pill button:focus-visible {
        color: var(--ink);
        background: var(--line);
      }
      .pill.fixed {
        padding-right: var(--s3);
      }
      .pill.fixed button {
        display: none;
      }
      .expression-input {
        margin: 0;
      }
      .expression-input input {
        box-sizing: border-box;
        width: 100%;
        height: 40px;
        padding: 0 var(--s3);
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .expression-input input:hover,
      .expression-input input:focus {
        outline: none;
        background: var(--wash);
      }
      /* What may finish what is typed, offered beneath it. */
      .expression-input {
        position: relative;
      }
      .completions {
        position: absolute;
        top: calc(100% + var(--s1));
        left: 0;
        z-index: 5;
        box-sizing: border-box;
        width: min(34rem, calc(100vw - 2 * var(--gutter)));
        max-height: min(60vh, 28rem);
        overflow-y: auto;
        margin: 0;
        padding: var(--s1);
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--raised);
        box-shadow:
          0 12px 32px rgb(0 0 0 / 0.12),
          0 2px 6px rgb(0 0 0 / 0.06);
      }
      .completions[hidden] {
        display: none;
      }
      .completions li {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: var(--s2);
        padding: var(--s1) var(--s3);
        border-radius: 8px;
        cursor: pointer;
      }
      .completions li[aria-selected="true"],
      .completions li:hover {
        background: var(--wash);
      }
      .completions .name {
        font-weight: 600;
      }
      .completions .takes {
        color: var(--quiet);
      }
      .completions .takes::before {
        content: "(";
      }
      .completions .takes::after {
        content: ")";
      }
      .completions .says {
        flex: 1 0 100%;
        overflow: hidden;
        color: var(--quiet);
        font-size: var(--size-small);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .expression-input input::placeholder {
        color: var(--quiet);
      }
      .expression-input.fixed input {
        color: var(--quiet);
      }

      /* The answer: where it stands, then what it gives. */
      .answer {
        padding-top: var(--s5);
      }
      .trail ol {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--s1) 0;
        margin: 0 0 var(--s4);
        padding: 0;
        list-style: none;
        font-size: var(--size-small);
        color: var(--quiet);
      }
      .trail li + li::before {
        content: "/";
        margin: 0 var(--s2);
        color: var(--line);
      }
      .trail a {
        color: var(--quiet);
        text-decoration: none;
      }
      .trail a:hover {
        color: var(--link);
        text-decoration: underline;
      }
      .trail [aria-current] {
        color: var(--ink);
      }
      .answered > .note {
        max-width: var(--measure);
      }
      .start {
        margin-bottom: var(--s5);
      }
      .start .lede {
        margin: var(--s2) 0 0;
        max-width: var(--measure);
        color: var(--quiet);
      }

      /* A holon as a record: its title, a quiet line of what it is, what it says, then its
         fields, each key beside its value. */
      .holon > header {
        margin-bottom: var(--s5);
      }
      .holon .kind {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
        margin: var(--s2) 0 0;
        color: var(--quiet);
        font-size: var(--size-small);
      }
      .holon .kind > * + *::before {
        content: "·";
        margin-right: var(--s2);
        color: var(--quiet);
        display: inline-block;
        text-decoration: none;
      }
      .lede {
        margin: var(--s3) 0 0;
        max-width: var(--measure);
        font-size: var(--size-up);
      }
      /* Short fields, each key beside its value, the keys in one column. */
      .fields {
        display: grid;
        grid-template-columns: fit-content(12rem) minmax(0, 1fr);
        align-items: baseline;
        gap: var(--s2) var(--s5);
        margin: 0;
      }
      .fields > div {
        display: contents;
      }
      .fields .fields {
        gap: var(--s1) var(--s4);
      }
      .fields dt {
        color: var(--quiet);
        font-size: var(--size-small);
        overflow-wrap: anywhere;
      }
      .fields dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .fields dd > .words {
        max-width: var(--measure);
        display: inline-block;
      }
      .fields .shape {
        display: block;
        font: 0.8rem / 1.4 var(--mono);
        color: var(--quiet);
      }
      /* A long field, a section of its own under its key, the page's full width. */
      .field {
        margin-top: var(--s6);
      }
      .holon > .fields + .field,
      .holon > header + .field {
        margin-top: var(--s5);
      }
      .record > .field:first-child {
        margin-top: 0;
      }
      h2.key {
        margin: 0 0 var(--s3);
        font: 600 var(--size-small) / 1.4 var(--sans);
        color: var(--quiet);
        letter-spacing: 0.02em;
      }
      .asks {
        margin: var(--s6) 0 0;
        font-size: var(--size-small);
      }
      .inline > * + *::before {
        content: ", ";
        color: var(--ink);
      }
      .inline > a + a::before {
        display: inline-block;
        white-space: pre;
      }
      a.unnamed {
        color: var(--quiet);
      }
      a.expression {
        text-decoration: none;
      }
      a.expression code {
        display: inline-block;
        padding: 2px var(--s2);
        border-radius: 6px;
        background: var(--wash);
        color: var(--ink);
        white-space: pre-wrap;
      }
      a.expression:hover code {
        color: var(--link);
      }
      .items {
        margin: 0;
        padding-left: 1.4em;
      }
      .items > li + li {
        margin-top: var(--s1);
      }
      pre.text {
        margin: 0;
        white-space: pre-wrap;
      }

      /* Holons in a list: their key and count, and the ways they may be shown, then the
         cards on one grid, one gap between them, or rows, or a table. */
      .holons > header {
        display: flex;
        align-items: baseline;
        gap: var(--s2);
        margin-bottom: var(--s3);
      }
      .holons > header h2.key {
        margin: 0;
      }
      .holons .count {
        color: var(--quiet);
        font-size: var(--size-small);
        font-variant-numeric: tabular-nums;
      }
      .holons .modes {
        display: flex;
        gap: 2px;
        margin-left: auto;
      }
      .holons .modes button {
        padding: 2px var(--s2);
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--quiet);
        font: var(--size-small) / 1.4 var(--sans);
        cursor: pointer;
      }
      .holons .modes button:hover {
        color: var(--ink);
      }
      .holons .modes button[aria-pressed="true"] {
        background: var(--wash);
        color: var(--ink);
      }
      .rows {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
        gap: var(--s3);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .rows > .more {
        grid-column: 1 / -1;
        padding-top: var(--s2);
        font-size: var(--size-small);
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        height: 100%;
        box-sizing: border-box;
        padding: var(--s3) var(--s4) var(--s4);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--raised);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.12s;
      }
      .card:hover,
      .card:focus-visible {
        border-color: color-mix(in srgb, var(--link) 50%, var(--line));
      }
      .card .card-name {
        font-size: var(--size-up);
        font-weight: 600;
        line-height: 1.3;
        color: var(--link);
        overflow-wrap: anywhere;
      }
      .card .card-says {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .card-kind {
        margin-top: auto;
        padding-top: var(--s1);
        font-size: var(--size-small);
        color: var(--quiet);
      }
      .card .card-kind:empty,
      .card .card-says:empty {
        display: none;
      }
      /* As rows: one line each, its title, what it says, what it is. */
      .rows[data-mode="rows"] {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        margin-inline: calc(-1 * var(--s3));
      }
      .rows[data-mode="rows"] > .more {
        padding-inline: var(--s3);
      }
      .rows[data-mode="rows"] .card {
        display: grid;
        grid-template-columns: minmax(8rem, 18rem) minmax(0, 1fr) auto;
        align-items: baseline;
        gap: var(--s4);
        padding: var(--s1) var(--s3);
        border: 0;
        border-radius: 6px;
        background: transparent;
      }
      .rows[data-mode="rows"] .card:hover,
      .rows[data-mode="rows"] .card:focus-visible {
        background: var(--wash);
      }
      .rows[data-mode="rows"] .card-name {
        font-size: var(--size-body);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rows[data-mode="rows"] .card-says {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--quiet);
      }
      .rows[data-mode="rows"] .card-says:empty {
        display: block;
      }
      .rows[data-mode="rows"] .card-kind {
        margin: 0;
        padding: 0;
        text-align: right;
        white-space: nowrap;
      }
      /* As a table: what each keeps, by key. */
      .table {
        overflow-x: auto;
        margin-inline: calc(-1 * var(--s3));
      }
      .table table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th,
      .table td {
        padding: var(--s1) var(--s3);
        text-align: left;
        vertical-align: baseline;
      }
      .table thead th {
        font-size: var(--size-small);
        font-weight: 600;
        color: var(--quiet);
        white-space: nowrap;
      }
      .table tbody th {
        font-weight: 600;
        white-space: nowrap;
      }
      .table tbody th a {
        text-decoration: none;
      }
      .table tbody tr:hover {
        background: var(--wash);
      }

      /* A brief: prose to a measure, its sections spaced by the scale. */
      .brief {
        max-width: var(--measure);
      }
      .brief p,
      .brief ul,
      .brief blockquote,
      .brief pre {
        margin: 0 0 var(--s4);
      }
      .brief pre {
        overflow-x: auto;
        padding: var(--s3) var(--s4);
        border-radius: var(--radius);
        background: var(--wash);
      }
      .brief h1 {
        margin-bottom: var(--s5);
      }
      .brief section > section {
        margin-top: var(--s6);
      }
      .brief h2,
      .brief h3,
      .brief h4,
      .brief h5,
      .brief h6 {
        font: 600 var(--size-h2) / 1.2 var(--serif);
        margin: 0 0 var(--s3);
      }
      .brief h3,
      .brief h4,
      .brief h5,
      .brief h6 {
        font-size: var(--size-h3);
      }
      .brief p.lede {
        margin: 0 0 var(--s5);
      }
      .brief hr {
        height: var(--s6);
        margin: 0 0 var(--s4);
        border: 0;
        text-align: center;
        color: var(--quiet);
      }
      .brief hr::before {
        content: "· · ·";
      }
      .brief h2 a,
      .brief h3 a,
      .brief h4 a {
        color: inherit;
        text-decoration: none;
      }
      .brief h2 a:hover,
      .brief h3 a:hover,
      .brief h4 a:hover {
        color: var(--link);
      }
      .brief blockquote {
        padding-left: var(--s4);
        border-left: 2px solid var(--line);
        color: var(--quiet);
      }
      .brief .unlinked {
        border-bottom: 1px dotted var(--quiet);
        cursor: help;
      }
      .brief .face {
        margin: 0 0 var(--s4);
      }
      .brief .waiting {
        min-height: 4rem;
      }
      .choose {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s2);
      }
      .choose button {
        padding: var(--s1) var(--s3);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      /* The inspector: what a place is, by the place pressed. */
      .inspected {
        outline: 2px solid var(--link);
        outline-offset: -2px;
      }
      a.ref.inspected,
      .trail .inspected {
        outline-offset: 2px;
        border-radius: 2px;
      }
      .inspector h2 a {
        text-decoration: none;
      }
      .inspector {
        position: fixed;
        z-index: 10;
        box-sizing: border-box;
        width: min(22rem, calc(100vw - 2 * var(--s4)));
