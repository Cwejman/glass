<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Glass</title>
    <style>
      :root {
        --ink: #1d1d1b;
        --quiet: #6b6a65;
        --ground: #fbfaf7;
        --link: #2b5a8a;
        --line: #e3e0d8;
        font:
          17px / 1.45 system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e9e7e1;
          --quiet: #9a978f;
          --ground: #161614;
          --link: #8db8e3;
          --line: #33322e;
        }
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 16px 4rem;
      }
      a {
        color: var(--link);
      }
      h1 {
        font:
          600 1.8rem / 1.2 Georgia,
          serif;
        margin: 0 0 0.3em;
      }
      .drawn {
        display: contents;
      }
      .meta,
      .note {
        color: var(--quiet);
      }
      .note {
        font-style: italic;
      }
      .words {
        white-space: pre-wrap;
      }
      .number {
        font-variant-numeric: tabular-nums;
      }
      .fields {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 0.4em 1em;
        margin: 0;
      }
      .fields dt {
        color: var(--quiet);
      }
      .fields dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .items {
        margin: 0;
        padding-left: 1.4em;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 1.5em;
      }
      .list.row {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4em;
      }
      .list.row > .drawn:has(.expression-input) > .expression-input {
        flex: 1 1 16em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.2em;
        margin: 0;
        padding: 0.15em 0.2em 0.15em 0.6em;
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      .pill .said {
        font:
          0.9rem / 1.4 ui-monospace,
          monospace;
      }
      .pill button {
        border: 0;
        border-radius: 999px;
        padding: 0 0.45em;
        background: transparent;
        color: var(--quiet);
        font: inherit;
        cursor: pointer;
      }
      .pill button:hover {
        color: var(--ink);
        background: var(--line);
      }
      .pill.fixed button {
        display: none;
      }
      .expression-input input {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5em 0.7em;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font:
          1rem / 1.4 ui-monospace,
          monospace;
      }
      .expression-input input:focus {
        outline: 2px solid var(--link);
        outline-offset: -1px;
      }
      .expression-input.fixed input {
        color: var(--quiet);
      }
      .holon + .holon,
      .list:not(.row) > .drawn + .drawn {
        border-top: 1px solid var(--line);
      }
    </style>
    <script type="module" src="./page.js"></script>
  </head>
  <body>
    <main id="glass"></main>
  </body>
</html>
